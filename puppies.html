<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="퍼피댕·디데이펫 강아지 개체·목욕·접종·분양 관리 노트">
<title>퍼피댕 · 디데이펫 — 강아지 관리 노트</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --brown:#6B4423; --brown-d:#5A381E; --brown-l:#B88456;
    --tint:#EFE5DA; --tint-2:#E5D6C5; --tint-3:#D7C0A6;
    --ink:#2E2116; --ink-2:#5C4837; --muted:#7E6957; --muted-2:#97836F;
    --line:#EDE2D5; --bg:#FAF6F1; --card:#ffffff;
    --red:#C94A38; --red-d:#B8432F; --red-t:#FCECE9; --amber:#A96A22; --amber-t:#FBF0DE;
    --green:#586C3C; --mint-t:#ECF1E3;
    --r:20px;
    --shadow:0 6px 20px rgba(122,88,52,.07), 0 1px 2px rgba(46,33,22,.04);
    --shadow-lg:0 14px 40px rgba(90,56,30,.16);
  }
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Segoe UI",system-ui,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(760px 340px at 50% -140px,#F1DFC8 0%,rgba(250,246,241,0) 68%);
    background-repeat:no-repeat; min-height:100vh;
  }
  body.lock{overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  h1,h2,h3,p{margin:0}
  .app{max-width:480px;margin:0 auto;padding:14px 16px calc(126px + env(safe-area-inset-bottom));position:relative}

  /* ---------- header ---------- */
  .topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
  .brand{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:-.01em;color:var(--brown-d)}
  .brand .logo{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;font-size:15px;
    background:linear-gradient(140deg,#A9743F,#6B4423);box-shadow:0 5px 12px rgba(107,68,35,.3)}
  .topact{display:flex;gap:7px}
  .gbtn{width:40px;height:40px;border-radius:13px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;
    font-size:16px;color:var(--ink-2);transition:transform .12s;border:1px solid rgba(237,226,213,.7)}
  .gbtn:active{transform:scale(.94)}
  .greet{font-size:23px;line-height:1.3;font-weight:800;letter-spacing:-.035em;margin:0 0 4px}
  .greet em{font-style:normal;color:var(--brown)}
  .dateline{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:-.01em}

  /* ---------- stats ---------- */
  .statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}
  .stat{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:9px 2px 8px;text-align:center;
    box-shadow:0 3px 10px rgba(122,88,52,.04)}
  .stat .num{font-size:19px;font-weight:800;letter-spacing:-.045em;line-height:1.15;color:var(--ink)}
  .stat .lab{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:-.03em;white-space:nowrap;margin-top:1px}
  .stat.warn{border-color:#F0D9BC;background:#FFFBF4}
  .stat.warn .num{color:var(--amber)}
  .stat.alert .num{color:var(--red)}
  .stat.alert{border-color:#F3D3CC;background:#FFFAF9}

  /* ---------- branch pills ---------- */
  .branchbar{margin:15px 0 0;display:flex;align-items:center;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .branchbar::-webkit-scrollbar{display:none}
  .bpill{flex:none;height:38px;padding:0 15px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
    font-size:13.5px;font-weight:800;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 2px 6px rgba(122,88,52,.05);transition:.15s;letter-spacing:-.02em;white-space:nowrap}
  .bpill .pc{font-size:11px;font-weight:800;color:var(--muted);background:#F5EEE5;border-radius:6px;padding:1px 5px}
  .bpill.on{background:linear-gradient(140deg,#8C5C2E,#5A381E);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(107,68,35,.28)}
  .bpill.on .pc{background:rgba(255,255,255,.22);color:#fff}
  .bpill:active{transform:scale(.97)}

  /* ---------- search ---------- */
  .searchbox{position:relative;margin-top:12px}
  .searchbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5;pointer-events:none}
  .search{width:100%;height:48px;border-radius:15px;border:1.5px solid #EDE1D2;background:#fff;padding:0 42px 0 38px;
    font-size:14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);transition:.15s;letter-spacing:-.01em;-webkit-appearance:none;appearance:none}
  .search::placeholder{color:var(--muted-2);font-weight:600}
  .search::-webkit-search-cancel-button,.search::-webkit-search-decoration{-webkit-appearance:none;display:none}
  .search:focus{outline:none;border-color:var(--tint-3);box-shadow:0 0 0 4px rgba(168,120,74,.13)}
  .searchclear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:10px;
    display:grid;place-items:center;color:var(--muted);font-size:13px;background:#F5EEE5}
  [hidden]{display:none !important}

  /* ---------- status chips + tools ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:34px;padding:0 12px;border-radius:11px;background:#fff;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.02em;display:inline-flex;align-items:center;gap:5px;transition:.15s}
  .chip .cn{font-size:10.5px;color:var(--muted-2);font-weight:800}
  .chip.on{background:var(--tint);border-color:var(--tint-3);color:var(--brown-d)}
  .chip.on .cn{color:var(--brown)}
  .chip.done{color:var(--green);border-color:#DEE5D0;background:#F5F8EE}
  .filterwrap{margin-top:12px}
  .toolrow{display:flex;align-items:center;gap:8px;margin-top:9px}
  .rcount{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:-.02em;white-space:nowrap}
  .rcount b{color:var(--brown-d);font-size:13px}
  .tools{margin-left:auto;display:flex;align-items:center;gap:6px}
  .tbtn{height:31px;padding:0 10px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:11.5px;font-weight:800;
    color:var(--ink-2);letter-spacing:-.02em;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .tbtn.on{background:#F3E7D6;border-color:var(--tint-3);color:var(--brown-d)}
  .sortsel{height:31px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:11.5px;font-weight:800;
    color:var(--ink-2);padding:0 6px;-webkit-appearance:none;appearance:none;letter-spacing:-.02em}
  .sortsel:focus{outline:none;border-color:var(--tint-3)}

  /* ---------- notice / alert ---------- */
  .notice{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 10px 9px 12px;border-radius:13px;
    background:#FFF8EC;border:1.5px solid #F2E2C8;font-size:11.5px;font-weight:700;color:#7E5A25;letter-spacing:-.02em;line-height:1.4}
  .notice .nx{margin-left:auto;flex:none;width:26px;height:26px;border-radius:8px;background:#F7E9D2;color:#8A6532;font-size:11px;display:grid;place-items:center}
  .alertbar{display:flex;align-items:center;gap:7px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#fff;
    border:1.5px solid #F3D3CC;box-shadow:0 3px 10px rgba(201,74,56,.06);font-size:12px;font-weight:800;color:var(--red-d);letter-spacing:-.02em;line-height:1.35}
  .alertbar .ago{margin-left:auto;flex:none;height:28px;padding:0 9px;border-radius:9px;background:var(--red-t);color:var(--red-d);font-size:11px;font-weight:800}

  /* ---------- section title ---------- */
  .sechead{display:flex;align-items:baseline;gap:6px;margin:18px 2px 9px}
  .list > .sechead:first-child{margin-top:4px}
  .sechead h2{font-size:14px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
  .sechead .n{font-size:12px;font-weight:800;color:var(--muted-2)}

  /* ---------- cards ---------- */
  .list{display:block}
  .card{background:#fff;border-radius:20px;box-shadow:var(--shadow);border:1px solid rgba(237,226,213,.85);
    overflow:hidden;margin-bottom:12px;transition:transform .15s}
  .card:active{transform:scale(.996)}
  .cphoto{position:relative;aspect-ratio:16/9;background:#EFE5DA;cursor:pointer;overflow:hidden}
  .cphoto img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block}
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:radial-gradient(120% 100% at 20% 0%,#FFF7EC 0%,#F3E4D1 55%,#E7D3BB 100%);color:#A97C4E}
  .ph::before{content:'';position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(circle at 13px 13px, rgba(160,120,80,.16) 2px, transparent 2.4px);background-size:28px 28px}
  .ph.b2{background:radial-gradient(120% 100% at 20% 0%,#F9FAF2 0%,#EBEFE0 55%,#DBE2CD 100%);color:#6C7F4E}
  .ph.b2::before{background-image:radial-gradient(circle at 13px 13px, rgba(96,116,70,.16) 2px, transparent 2.4px)}
  .ph .phemo{position:relative;font-size:52px;line-height:1;filter:drop-shadow(0 6px 10px rgba(120,80,40,.18));opacity:.9}
  .ph .phlab{position:relative;font-size:11.5px;font-weight:800;color:#9C7B5A;letter-spacing:-.02em;
    background:rgba(255,255,255,.6);padding:2px 8px;border-radius:7px;margin-top:4px}
  .ph.b2 .phlab{color:#778A5A}
  .cbadges{position:absolute;left:10px;top:10px;display:flex;gap:5px;max-width:82%;flex-wrap:wrap}
  .btag{height:24px;padding:0 9px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:-.02em;
    display:inline-flex;align-items:center;gap:3px;color:#fff;background:rgba(90,56,30,.84);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(46,33,22,.14)}
  .btag.b2{background:rgba(88,108,60,.88)}
  .btag.cage{background:rgba(255,255,255,.95);color:var(--brown-d)}
  .stchip{position:absolute;left:10px;bottom:10px;height:26px;padding:0 10px;border-radius:9px;font-size:11.5px;font-weight:800;
    display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:var(--ink);
    box-shadow:0 2px 8px rgba(46,33,22,.14);letter-spacing:-.02em}
  .stchip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .stchip.available{color:#4F7A4A}
  .stchip.reserved{color:#A96A22}
  .stchip.sold{color:#8B7A68}
  .photobtn{position:absolute;right:10px;bottom:10px;height:26px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.95);
    color:var(--brown-d);font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:3px;
    box-shadow:0 2px 8px rgba(46,33,22,.14);letter-spacing:-.02em}
  .photobtn:active{transform:scale(.96)}
  .pdots{position:absolute;right:12px;top:12px;display:flex;gap:4px}
  .pdots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);
    box-shadow:0 0 0 1px rgba(46,33,22,.22), 0 1px 3px rgba(46,33,22,.3)}
  .pdots i.on{background:#fff}
  .cbody{padding:12px 14px 13px}
  .crow{display:flex;align-items:baseline;gap:8px}
  .cname{font-size:17.5px;font-weight:800;letter-spacing:-.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cprice{font-size:13.5px;font-weight:800;color:var(--brown-d);letter-spacing:-.02em;white-space:nowrap}
  .cprice.muted{color:var(--muted-2);font-weight:700;font-size:12.5px}
  .csub{margin-top:2px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:-.02em;
    display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .csub .sep{color:var(--tint-3);font-weight:700}
  .cmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .mchip{height:23px;padding:0 8px;border-radius:8px;background:#F7F0E7;color:var(--ink-2);font-size:11.5px;font-weight:800;
    display:inline-flex;align-items:center;gap:3px;letter-spacing:-.02em}
  .mchip.age{background:#FAF3E9}
  .cbathrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed #EFE3D4}
  .bathbadge{flex:1;min-width:0;font-size:12px;font-weight:800;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;
    letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bathbadge.warn{color:#B06714}
  .bathbadge.ok{color:#4F7A4A}
  .bathbadge.none{color:var(--muted-2);font-weight:700}
  .bathbtn{flex:none;height:34px;padding:0 12px;border-radius:11px;background:linear-gradient(140deg,#8C5C2E,#5A381E);
    color:#fff;font-size:12.5px;font-weight:800;letter-spacing:-.02em;box-shadow:0 5px 14px rgba(107,68,35,.24);white-space:nowrap}
  .bathbtn:active{transform:scale(.96)}
  .ctail{margin-top:8px;font-size:11.5px;font-weight:800;color:var(--amber);display:flex;align-items:center;gap:4px;letter-spacing:-.02em}
  .ctail.over{color:var(--red-d)}
  .ctail .arr{margin-left:auto;color:var(--muted-2);font-weight:700}

  /* ---------- empty ---------- */
  .empty{text-align:center;padding:36px 18px 30px;background:#fff;border-radius:20px;border:1.5px dashed #E6D8C6;margin-top:4px}
  .empty .ee{font-size:34px;line-height:1}
  .empty h3{margin-top:8px;font-size:15.5px;font-weight:800;letter-spacing:-.03em}
  .empty p{margin-top:5px;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.55}
  .empty .btn{margin-top:14px}

  .footnote{margin:16px 4px 0;font-size:11px;color:var(--muted-2);font-weight:700;text-align:center;line-height:1.6;letter-spacing:-.02em}

  /* ---------- bottom bar ---------- */
  .bottombar{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
    display:flex;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,252,248,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid #EDE1D2;box-shadow:0 -8px 24px rgba(90,56,30,.07)}
  .addbtn{flex:1;height:50px;border-radius:16px;background:linear-gradient(140deg,#8C5C2E,#5A381E);color:#fff;
    font-size:14.5px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 8px 20px rgba(107,68,35,.28)}
  .addbtn:active{transform:scale(.985)}
  .sidebtn{flex:none;width:56px;height:50px;border-radius:16px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;
    font-size:17px;color:var(--ink-2);box-shadow:var(--shadow)}
  .sidebtn:active{transform:scale(.96)}

  /* ---------- buttons ---------- */
  .btn{height:44px;padding:0 14px;border-radius:13px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:800;
    color:var(--ink-2);letter-spacing:-.02em;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(140deg,#8C5C2E,#5A381E);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(107,68,35,.22)}
  .btn.sm{height:38px;padding:0 12px;border-radius:11px;font-size:12.5px}
  .btn.wide{width:100%}
  .btn.danger{color:var(--red-d);border-color:#F0D0CA;background:#FFF9F8}
  .btn.rowbtn{margin-top:10px}

  /* ---------- sheet ---------- */
  .sheetwrap{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-end}
  .scrim{position:absolute;inset:0;background:rgba(46,33,22,.44);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:fade .18s ease}
  .sheet{position:relative;width:100%;max-width:480px;max-height:94vh;background:#FFFDFB;border-radius:26px 26px 0 0;
    box-shadow:0 -10px 40px rgba(90,56,30,.26);display:flex;flex-direction:column;overflow:hidden;
    animation:up .24s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheetbar{display:flex;align-items:center;gap:9px;padding:11px 12px 10px;border-bottom:1px solid var(--line);
    background:rgba(255,253,251,.97);flex:none}
  .ibtn{width:38px;height:38px;border-radius:12px;background:#F5EEE5;display:grid;place-items:center;font-size:15px;
    color:var(--ink-2);flex:none}
  .ibtn:active{transform:scale(.94)}
  .sheetbar .stitle{flex:1;min-width:0}
  .sheetbar .stitle b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheetbar .stitle span{display:block;font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:-.02em;margin-top:1px}
  .sheetbody{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:14px 16px calc(26px + env(safe-area-inset-bottom))}

  /* ---------- detail ---------- */
  .dphoto{border-radius:18px;background:#F7F0E7;padding:8px;border:1.5px solid var(--line)}
  .dphotobar{display:flex;align-items:center;gap:6px}
  .ptab{height:32px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--muted);background:#fff;
    border:1.5px solid var(--line);letter-spacing:-.02em}
  .ptab.on{background:var(--tint);border-color:var(--tint-3);color:var(--brown-d)}
  .cmpbtn{margin-left:auto;height:32px;padding:0 10px;border-radius:10px;background:#fff;border:1.5px solid var(--line);
    font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.02em}
  .cmpbtn.on{background:var(--tint);border-color:var(--tint-3);color:var(--brown-d)}
  .dphmain{position:relative;aspect-ratio:4/3;margin-top:8px;border-radius:14px;overflow:hidden;background:#EFE5DA}
  .dphmain img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block}
  .dcmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .dcmpcell{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#EFE5DA}
  .dcmpcell img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block}
  .dcmpcell .clab{position:absolute;left:6px;top:6px;height:22px;padding:0 7px;border-radius:7px;background:rgba(255,255,255,.94);
    color:var(--brown-d);font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;letter-spacing:-.02em}
  .dphmain .bigph .phemo,.dcmpcell .ph .phemo{font-size:38px}
  .dphmain .bigph .phlab{font-size:12px}

  .dhead{margin-top:14px}
  .dnamerow{display:flex;align-items:center;gap:8px}
  .dname{font-size:24px;font-weight:800;letter-spacing:-.045em;line-height:1.2;flex:1;min-width:0}
  .dprice{font-size:15px;font-weight:800;color:var(--brown-d);letter-spacing:-.03em;white-space:nowrap}
  .dprice.muted{color:var(--muted-2);font-size:13px}
  .dsub{margin-top:4px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:-.02em;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .dsub .sep{color:var(--tint-3)}
  .statusseg{display:flex;gap:5px;background:#F5EEE5;padding:4px;border-radius:13px;margin-top:12px}
  .sseg{flex:1;height:36px;border-radius:10px;font-size:12.5px;font-weight:800;letter-spacing:-.02em;color:var(--muted)}
  .sseg.on{background:#fff;box-shadow:0 2px 8px rgba(90,56,30,.12)}
  .sseg.on.available{color:#4F7A4A}
  .sseg.on.reserved{color:#A96A22}
  .sseg.on.sold{color:#7A6654}

<script>
(function(){
  'use strict';

  /* ================= 기본 상수 ================= */
  var KEY = 'puppydang_puppies_v1';
  var BRANCHES = ['퍼피댕','디데이펫'];
  var STATUS = {
    available:{label:'분양중', cls:'available'},
    reserved:{label:'예약중', cls:'reserved'},
    sold:{label:'분양완료', cls:'sold'}
  };
  var STATUS_KEYS = ['available','reserved','sold'];
  var VAC_PRESETS = ['1차 종합백신','2차 종합백신','3차 종합백신','4차 종합백신','5차 종합백신','심장사상충','구충','켄넬코프','광견병'];

  var errs = [];
  window.__errors = errs;
  window.addEventListener('error', function(e){ errs.push(String((e && e.message) || e)); });
  window.addEventListener('unhandledrejection', function(e){ errs.push('promise: ' + String(e && e.reason)); });
  var _err = console.error;
  console.error = function(){ errs.push(Array.prototype.slice.call(arguments).map(String).join(' ')); _err.apply(console, arguments); };

  /* ================= 유틸 ================= */
  function $(s, r){ return (r || document).querySelector(s); }
  function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var _idc = 0;
  function uid(){ _idc++; return 'p' + Date.now().toString(36) + _idc.toString(36) + Math.random().toString(36).slice(2,6); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function todayStr(){ return ymd(new Date()); }
  function shiftDate(days){ var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+days); return ymd(d); }
  function parseYmd(s){
    if(!s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    if(!m) return null;
    return Date.UTC(+m[1], +m[2]-1, +m[3]);
  }
  function daysBetween(a,b){
    var A = parseYmd(a), B = parseYmd(b);
    if(A === null || B === null) return null;
    return Math.round((B - A) / 86400000);
  }
  function daysSince(s){ return daysBetween(s, todayStr()); }
  var WEEK = ['일','월','화','수','목','금','토'];
  function fmtMD(s){
    var t = parseYmd(s); if(t === null) return '—';
    var d = new Date(t); return (d.getUTCMonth()+1) + '월 ' + d.getUTCDate() + '일';
  }
  function fmtFull(s){
    var t = parseYmd(s); if(t === null) return '—';
    var d = new Date(t);
    return d.getUTCFullYear() + '년 ' + (d.getUTCMonth()+1) + '월 ' + d.getUTCDate() + '일 (' + WEEK[d.getUTCDay()] + ')';
  }
  function fmtShort(s){
    var t = parseYmd(s); if(t === null) return '—';
    var d = new Date(t); return (d.getUTCMonth()+1) + '/' + pad(d.getUTCDate());
  }
  function won(n){
    n = Math.max(0, Math.round(Number(n) || 0));
    return n.toLocaleString('ko-KR') + '원';
  }
  function manwon(n){
    n = Math.round(Number(n) || 0);
    if(!n) return '가격 미정';
    if(n % 10000 === 0) return (n/10000).toLocaleString('ko-KR') + '만원';
    return (n/10000).toFixed(1).replace(/\.0$/,'') + '만원';
  }
  function agoText(s){
    var d = daysSince(s);
    if(d === null) return '';
    if(d <= 0) return '오늘';
    if(d === 1) return '어제';
    return d + '일 전';
  }
  function intakeDays(p){
    var d = daysBetween(p.intakeDate, todayStr());
    if(d === null) return null;
    return d + 1; // 입소일 = 1일차
  }
  function ageInfo(birth){
    if(!birth) return null;
    var days = daysBetween(birth, todayStr());
    if(days === null || days < 0) return null;
    if(days < 60) return { main: '생후 ' + days + '일', sub:'생후 ' + days + '일', months:0, days:days };
    var b = new Date(parseYmd(birth)), t = new Date(parseYmd(todayStr()));
    var months = (t.getUTCFullYear()-b.getUTCFullYear())*12 + (t.getUTCMonth()-b.getUTCMonth());
    if(t.getUTCDate() < b.getUTCDate()) months--;
    if(months < 1) months = 1;
    if(months < 24){
      return { main:'생후 ' + months + '개월', sub:'생후 ' + months + '개월 (' + days + '일)', months:months, days:days };
    }
    var y = Math.floor(months/12), m = months % 12;
    return { main:'생후 ' + y + '년' + (m ? ' ' + m + '개월' : ''), sub:'생후 ' + y + '년 ' + m + '개월 (' + days + '일)', months:months, days:days };
  }
  function lastBath(p){
    if(!p.baths || !p.baths.length) return null;
    return p.baths.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); })[0];
  }
  function bathDays(p){
    var l = lastBath(p);
    if(!l) return null;
    var d = daysSince(l.date);
    return d === null ? null : Math.max(0, d);
  }
  function bathLabel(p){
    var d = bathDays(p);
    if(d === null) return { text:'목욕 기록 없음', cls:'none' };
    if(d === 0) return { text:'오늘 목욕했어요', cls:'ok' };
    return { text:'목욕한 지 ' + d + '일째', cls: d >= 7 ? 'warn' : 'calm' };
  }
  function dday(dateStr){
    if(!dateStr) return null;
    var d = daysBetween(todayStr(), dateStr);
    if(d === null) return null;
    if(d === 0) return { text:'D-DAY', cls:'alert', diff:0 };
    if(d > 0) return { text:'D-' + d, cls: d <= 3 ? 'warn' : 'calm', diff:d };
    return { text:'D+' + Math.abs(d) + ' 지남', cls:'alert', diff:d };
  }
  function isValidDate(s){ return parseYmd(s) !== null; }
  function breedEmoji(b){
    var t = String(b || '');
    if(/비숑|푸들|말티즈|말티푸/.test(t)) return '🐩';
    if(/포메|치와와|스피츠/.test(t)) return '🐕';
    if(/웰시|코기|셰퍼드|리트리버|골든|진돗/.test(t)) return '🦮';
    if(/시바|아키타/.test(t)) return '🐕';
    if(/닥스|비글|코카/.test(t)) return '🐶';
    return '🐶';
  }

  /* ================= 저장 ================= */
  function norm(p){
    p = p || {};
    var status = STATUS_KEYS.indexOf(p.status) >= 0 ? p.status : 'available';
    return {
      id: p.id || uid(),
      branch: p.branch === '디데이펫' ? '디데이펫' : '퍼피댕',

  function blankState(){
    return { v:1, hidePrice:false, hintDismissed:false, puppies: samplePuppies(), seeded:true, createdAt:new Date().toISOString() };
  }

  function loadState(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){ raw = null; }
    if(!raw){
      var s = blankState();
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){}
      return s;
    }
    var data = null;
    try { data = JSON.parse(raw); } catch(e){ data = null; }
    if(!data || typeof data !== 'object' || !Array.isArray(data.puppies)){
      return blankState();
    }
    return {
      v: 1,
      hidePrice: !!data.hidePrice,
      hintDismissed: !!data.hintDismissed,
      puppies: data.puppies.map(norm),
      seeded: !!data.seeded,
      createdAt: data.createdAt || new Date().toISOString()
    };
  }

  /* ================= 목록 ================= */
  function statusLabel(s){ return (STATUS[s] || STATUS.available).label; }

  function matchQuery(p, q){
    if(!q) return true;
    var hay = [p.cage, p.breed, p.name, p.color, p.branch].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function filtered(){
    var q = ui.q.trim().toLowerCase();
    var arr = state.puppies.filter(function(p){
      if(ui.branch !== '전체' && p.branch !== ui.branch) return false;
      if(ui.status !== '전체' && p.status !== ui.status) return false;
      return matchQuery(p, q);
    });
    arr.sort(function(a,b){
      if(ui.sort === 'cage' && ui.branch === '전체'){
        var bi = BRANCHES.indexOf(a.branch) - BRANCHES.indexOf(b.branch);
        if(bi !== 0) return bi;
      }
      if(ui.sort === 'intake'){
        var c = String(b.intakeDate).localeCompare(String(a.intakeDate));
        return c !== 0 ? c : String(a.cage).localeCompare(String(b.cage), 'ko', {numeric:true});
      }
      if(ui.sort === 'bath'){
        var da = bathDays(a); var db = bathDays(b);
        da = (da === null) ? 99999 : da;
        db = (db === null) ? 99999 : db;
        if(da !== db) return db - da;
        return String(a.cage).localeCompare(String(b.cage), 'ko', {numeric:true});
      }
      return String(a.cage).localeCompare(String(b.cage), 'ko', {numeric:true, sensitivity:'base'});
    });
    return arr;
  }

    if(!draft) return null;
    draft.cage = ($('#fCage') ? $('#fCage').value : draft.cage).trim();
    draft.name = ($('#fName') ? $('#fName').value : draft.name).trim();
    draft.breed = ($('#fBreed') ? $('#fBreed').value : draft.breed).trim();
    draft.color = ($('#fColor') ? $('#fColor').value : draft.color).trim();
    var priceRaw = $('#fPrice') ? $('#fPrice').value : '';
    draft.price = Math.max(0, Math.round(Number(String(priceRaw).replace(/[^0-9]/g,'')) || 0));
    draft.intakeDate = $('#fIntake') ? $('#fIntake').value : draft.intakeDate;
    draft.birthDate = $('#fBirth') ? $('#fBirth').value : draft.birthDate;
    draft.memo = $('#fMemo') ? $('#fMemo').value : draft.memo;
    return draft;
  }

  function saveForm(){
    var d = readForm();
    if(!d) return;
    if(!d.name){ showFormError('이름(관리명)을 적어주세요.'); $('#fName').focus(); return; }
    if(!d.cage){ showFormError('장 번호를 적어주세요. (예: 1번장, A-03)'); $('#fCage').focus(); return; }
    if(!isValidDate(d.intakeDate)){ showFormError('입소일을 골라주세요.'); return; }
    if(d.birthDate && !isValidDate(d.birthDate)){ showFormError('생일을 다시 골라주세요.'); return; }
    var now = new Date().toISOString();
    var saved;
    if(ui.formEdit && ui.formId){
      var p = get(ui.formId);
      if(!p) return;
      var keep = { id:p.id, baths:p.baths, vaccines:p.vaccines, nextVaccine:p.nextVaccine, createdAt:p.createdAt };
      var merged = norm(Object.assign({}, p, d, { updatedAt: now }));
      merged.baths = keep.baths;
      merged.vaccines = keep.vaccines;
      merged.nextVaccine = keep.nextVaccine;
      merged.createdAt = keep.createdAt;
      for(var k in merged){ p[k] = merged[k]; }
      saved = p;
    } else {
      var np = norm(Object.assign({}, d, { createdAt: now, updatedAt: now }));
      state.puppies.push(np);
      saved = np;
    }
    if(!save()) return;
    renderAll();
    var wasEdit = ui.formEdit;
    ui.formEdit = false;
    ui.formId = null;
    ui.detailId = saved.id;
    ui.detailTab = 'profile';
    ui.compare = false;
    setSheet(detailHTML(saved.id));
    toast(wasEdit ? saved.name +' 정보를 저장했어요' : saved.name + ' 등록 완료!');
  }

  /* ================= 사진 ================= */
  function compressImage(file, cb){
    var reader = new FileReader();
    reader.onerror = function(){ toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.'); };
    reader.onload = function(e){
      var img = new Image();
      img.onerror = function(){ toast('이미지 형식을 읽을 수 없어요.'); };
      img.onload = function(){
        try {
          var MAX = 1080;
          var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          var scale = Math.min(1, MAX / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          var q = 0.82;
          var data = cv.toDataURL('image/jpeg', q);
          var guard = 0;
          while(data.length > 300000 && guard < 8){
            q = Math.max(0.35, q - 0.08);
            data = cv.toDataURL('image/jpeg', q);
            guard++;
          }
          cb(data);
        } catch(err){
          toast('사진을 처리하지 못했어요.');
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

      if(!draft) return;
      readForm();
      if(kind === 'store') draft.photoStore = dataURL; else draft.photoProfile = dataURL;
      setSheet(formHTML(), true);
      toast('사진을 추가했어요 (약 ' + Math.round(dataURL.length/1024) + 'KB)');
    });
  }

  function storageInfo(){
    var bytes = 0;
    try { bytes = new Blob([JSON.stringify(state)]).size; } catch(e){ bytes = JSON.stringify(state).length; }
    var photos = 0;
    state.puppies.forEach(function(p){
      if(p.photoProfile) photos += p.photoProfile.length;
      if(p.photoStore) photos += p.photoStore.length;
    });
    return { bytes: bytes, photos: Math.round(photos/1024), kb: Math.max(1, Math.round(bytes/1024)) };
  }

  function exportJSON(){
    var data = {
      app: 'puppydang-puppies', version: 1, exportedAt: new Date().toISOString(),
      hidePrice: state.hidePrice, puppies: state.puppies
    };
    try {
      var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'puppydang-puppies-' + todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
      toast('백업 파일을 내려받았어요 · ' + state.puppies.length + '마리');
    } catch(e){
      toast('백업 파일을 만들지 못했어요.');
    }
  }

  function importJSON(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var data = null;
      try { data = JSON.parse(e.target.result); } catch(err){ toast('JSON 파일을 읽지 못했어요.'); return; }
      var list = null;
      if(data && Array.isArray(data.puppies)) list = data.puppies;
      else if(Array.isArray(data)) list = data;
      if(!list){ toast('백업 파일 형식이 아니에요.'); return; }
      var ok = window.confirm('백업 파일로 바꿀까요?\n현재 ' + state.puppies.length + '마리 → 불러온 ' + list.length + '마리\n(지금 데이터는 사라집니다)');
      if(!ok) return;
      state.puppies = list.map(norm);
      if(data && typeof data.hidePrice === 'boolean') state.hidePrice = data.hidePrice;
      save();
      renderAll();
      setSheet(settingsHTML(), true);
      toast('백업을 복원했어요 · ' + state.puppies.length + '마리');
    };
    reader.onerror = function(){ toast('파일을 읽지 못했어요.'); };
    reader.readAsText(file);
  }

  function bathToday(id){
    var p = get(id);
    if(!p) return;
    var t = todayStr();
    if((p.baths || []).some(function(b){ return b.date === t; })){
      toast('오늘 목욕은 이미 기록되어 있어요');
      return;
    }
    p.baths = p.baths || [];
    p.baths.push({ id: uid(), date: t, memo:'' });
    p.updatedAt = new Date().toISOString();
    save();
    renderAll();
    if(ui.detailId === id) refreshDetail();
    toast(p.name + ' 목욕 완료 · ' + fmtMD(t) + ' 기록');
  }

  function deleteDog(id){
    var p = get(id);
    if(!p) return;
    if(!window.confirm('“' + p.name + '” 노트를 삭제할까요?\n목욕·접종 기록과 사진도 함께 지워지고, 되돌릴 수 없어요.')) return;

  function setStatus(id, st){
    var p = get(id);
    if(!p || !STATUS[st]) return;
    p.status = st;
    p.updatedAt = new Date().toISOString();
    save();
    renderAll();
    refreshDetail();

  function findBath(p, bid){
    for(var i=0;i<(p.baths||[]).length;i++){ if(p.baths[i].id === bid) return p.baths[i]; }
    return null;
  }
  function findVac(p, vid){
    for(var i=0;i<(p.vaccines||[]).length;i++){ if(p.vaccines[i].id === vid) return p.vaccines[i]; }
    return null;
  }

        break;

        break;

        $('#q').value = '';
        renderAll();
        break;
      case 'dismissHint':
        state.hintDismissed = true;
        save();
        renderAlert();

      case 'showHint':

        save();
        renderAll();
        toast('첫 화면 안내를 다시 켰어요');

          var kind = el.getAttribute('data-kind');

          toast('샘플 4마리를 추가했어요');

          if(!window.confirm('모든 노트(' + state.puppies.length + '마리)를 지울까요?\n되돌릴 수 없어요. 먼저 백업을 권해요.')) return;
          state.puppies = [];
          save(); renderAll(); setSheet(settingsHTML(), true);

        openGuide();
        break;

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if(!el) return;
    var name = el.getAttribute('data-act');
    act(name, el, e);
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ if(!$('#sheetWrap').hidden) closeSheet(); }
    if((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.classList.contains('card')){
      e.preventDefault();
      openDetail(document.activeElement.getAttribute('data-id'));
    }
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if(t.id === 'q'){
      ui.q = t.value;
      $('#qClear').hidden = !t.value;
      renderStatusChips();
      renderTools();
      renderList();
      return;
    }
    if(t.id === 'fPrice'){
      var v = Math.max(0, Math.round(Number(String(t.value).replace(/[^0-9]/g,'')) || 0));
      var h = $('#priceHint');
      if(h) h.innerHTML = v ? '<b>' + won(v) + '</b> · ' + manwon(v) : '비워두면 ‘가격 미정’으로 표시돼요';
      return;
    }
    if(t.id === 'fIntake'){
      var n = daysBetween(t.value, todayStr());
      var ih = $('#intakeHint');
      if(ih) ih.innerHTML = (n !== null) ? '<b>입소 ' + Math.max(1, n+1) + '일차</b>' : '입소일을 골라주세요';
      return;
    }
    if(t.id === 'fBirth'){
      var ag = ageInfo(t.value);
      var bh = $('#birthHint');
      if(bh) bh.innerHTML = ag ? '<b>' + ag.main + '</b> · ' + ag.days + '일' : '생년월일을 고르면 자동 계산돼요';
      return;
    }
    if(t.id === 'memoBox'){
      var p = get(ui.detailId);
      if(!p) return;
      p.memo = t.value;
      p.updatedAt = new Date().toISOString();
      var sv = $('#memoSaved');
      if(sv){ sv.textContent = '저장 중…'; sv.classList.remove('on'); }
      if(window.__memoT) clearTimeout(window.__memoT);

        save();
        var s2 = $('#memoSaved');
        if(s2){ s2.textContent = '저장됨 ✓'; s2.classList.add('on'); }
      }, 500);
    }

  document.addEventListener('change', function(e){
    var t = e.target;
    if(t.id === 'qClear') return;
    if(t.id === 'fileProfile' || t.id === 'fileStore'){
      var kind = t.id === 'fileStore' ? 'store' : 'profile';
      if(t.files && t.files[0]) handlePhoto(t.files[0], kind);
      t.value = '';
      return;
    }
    if(t.id === 'restoreFile'){
      if(t.files && t.files[0]) importJSON(t.files[0]);
      t.value = '';
      return;
    }
    if(t.id === 'sortSel'){
      ui.sort = t.value;
      renderList();
      return;
    }
    var p = get(ui.detailId);
    if(!p) return;
    var actName = t.getAttribute('data-act');
    if(actName === 'bathDate'){
      var b = findBath(p, t.getAttribute('data-id'));
      if(b && isValidDate(t.value)){
        b.date = t.value;
        p.updatedAt = new Date().toISOString();
        save(); renderAll(); refreshDetail();
        toast(fmtMD(b.date) + '(으)로 고쳤어요');
      }
      return;
    }
    if(actName === 'vacDate'){
      var v = findVac(p, t.getAttribute('data-id'));
      if(v && isValidDate(t.value)){
        v.date = t.value;
        p.updatedAt = new Date().toISOString();
        save(); renderAll(); refreshDetail();
        toast('접종 날짜를 고쳤어요');
      }
      return;
    }
    if(actName === 'vacMemo'){
      var v2 = findVac(p, t.getAttribute('data-id'));
      if(v2){
        v2.memo = t.value.trim();
        p.updatedAt = new Date().toISOString();
        save();
        toast('메모를 저장했어요');
      }
      return;
    }
    if(actName === 'nextVac' || t.id === 'nextVac'){
      if(isValidDate(t.value)){
        p.nextVaccine = t.value;
        p.updatedAt = new Date().toISOString();
        save(); renderAll(); refreshDetail();
        toast('다음 접종일을 ' + fmtMD(t.value) + '(으)로 저장했어요');
      } else if(t.value === ''){
        p.nextVaccine = '';
        p.updatedAt = new Date().toISOString();
        save(); renderAll(); refreshDetail();
      }
      return;
    }
  });

  $('#qClear').addEventListener('click', function(){
    ui.q = ''; $('#q').value = ''; $('#qClear').hidden = true;
    renderStatusChips(); renderTools(); renderList();
    $('#q').focus();
  });

  /* ================= 시작 ================= */
  renderAll();
  if(window.__errors.length){
    // 개발 중 조용한 확인용
    console.warn('init errors', window.__errors);
  }
})();
</script>
</body>
</html>
